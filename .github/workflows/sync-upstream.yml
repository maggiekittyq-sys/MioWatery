

name: Sync upstream

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/water649/MioWatery.git
          git fetch upstream main

      - name: Merge upstream
        run: git merge --no-edit upstream/main

      - name: Create update PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream-sync
          base: main
          title: "Update from upstream"
          body: "Automatic upstream update. Review before merging."
.
