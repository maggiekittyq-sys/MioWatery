name: Sync upstream

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/water649/MioWatery.git
          git fetch upstream main

      - name: Create sync branch
        run: |
          git checkout -b upstream-sync
          git merge --no-commit --no-ff upstream/main

      - name: Create update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-sync
          base: main
          title: "Update from upstream"
          body: "Review upstream changes before merging."
